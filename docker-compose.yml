version: '3'
services:
  retaildb:
    image: postgres:16-alpine
    container_name: retail
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: retaildb
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  retailpgadmintweb:
    image: dpage/pgadmin4
    container_name: retailpgadmintweb
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5052:80'
    depends_on:
      - retaildb
 
  app:
    build:
      context: ./
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '5000:5000'
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      - retaildb
volumes:
  postgres_data:
networks:
  default:
    driver: bridge

